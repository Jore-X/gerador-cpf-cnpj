<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Gerador de CPF</title>
  </head>
  <body>
    <main>
      <div class="cpf-box">
        <div class="cpf-generate-box cpf-boxes">
          <div class="title-box">
            <h2>Gerar CPF</h2>
            <p>Gere CPFs válidos para testes</p>
          </div>
          <div class="window-box">
            <div class="checkbox-div">
              <input type="checkbox" id="formatting_checkbox"/>
              <span>Com pontuação</span>
            </div>
            <button id="cpf_btn_generate" class="action-btn">
              <i class="fa-solid fa-arrows-rotate"></i>GERAR CPF
            </button>
            <div class="result-box">
              <div class="result-field"></div>
              <button id="cpf_btn_copy">
                <i class="fa-regular fa-clipboard"></i><span>Copiar</span>
              </button>
            </div>
          </div>
        </div>
        <div class="cpf-validate-box cpf-boxes">
          <div class="title-box">
            <h2>Validar CPF</h2>
            <p>Verifique a validade de um CPF</p>
          </div>
          <div class="window-box">
            <div class="input-cpf-box">
              <label for="input_cpf_validate">Insira o CPF</label>
              <input
                type="text"
                id="input_cpf_validate"
                placeholder="000.000.000-00"
              />
            </div>
            <button id="cpf_btn_validate" class="action-btn">
              <i class="fa-solid fa-check"></i><span>Validar</span>
            </button>
            <div class="response-row">
              <div>
                <i class="fa-solid fa-circle-check"></i><span>CPF Válido</span>
              </div>
              <div>
                <i class="fa-solid fa-circle-xmark"></i><span>CPF Inválido</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./utils.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
