<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Gerador de CPF</title>
  </head>
  <body>
    <main>
      <div class="cpf-box">
        <div class="cpf-generate-box">
          <h2>Gerador de CPF</h2>
          <div class="result-box">
            <div class="result-field"></div>
            <div class="cpf-btn-box">
              <button class="cpf-btn-generate">Gerar</button>
              <button class="cpf-btn-copy">Copiar</button>
            </div>
          </div>
        </div>
        <div class="cpf-validate-box">
          <h2>Validar CPF</h2>
          <input type="text" placeholder="CPF" />
          <button class="cpf-btn-validate">Validar</button>
        </div>
      </div>
    </main>

    <script src="./utils.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
